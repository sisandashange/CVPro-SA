<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CVPro-SA | Reset Password</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f4f4f4;
      color: #111;
      font-family: Arial, sans-serif;
    }

    .card {
      width: 100%;
      max-width: 420px;
      padding: 28px 22px;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 12px;
    }

    h1 {
      margin-top: 0;
      font-size: 25px;
    }

    p {
      color: #555;
      line-height: 1.6;
    }

    label {
      display: block;
      margin: 20px 0 8px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #bbb;
      border-radius: 7px;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 18px;
      padding: 14px;
      border: 0;
      border-radius: 7px;
      background: #111;
      color: #fff;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #message {
      margin-top: 16px;
      overflow-wrap: anywhere;
    }

    a {
      color: #111;
    }
  </style>
</head>

<body>
  <main class="card">
    <h1>Reset your password</h1>

    <p>
      Enter the email address linked to your CVPro-SA account.
      We will send you a secure link to choose a new password.
    </p>

    <form id="resetForm">
      <label for="email">Email address</label>

      <input
        type="email"
        id="email"
        autocomplete="email"
        placeholder="Enter your email"
        required
      >

      <button type="submit" id="sendButton">
        Send password reset link
      </button>
    </form>

    <p id="message" role="status" aria-live="polite"></p>

    <p>
      <a href="./owner-payments.html">Return to owner payments</a>
    </p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL =
      "https://tnxlhpenttcynlmlohao.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_n4XzrnraET_AEMbCYtHV7Q_DJ8--zCL";

    const client = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    const resetForm = document.getElementById("resetForm");
    const emailInput = document.getElementById("email");
    const sendButton = document.getElementById("sendButton");
    const message = document.getElementById("message");

    resetForm.addEventListener("submit", async function (event) {
      event.preventDefault();

      const email = emailInput.value.trim();

      message.textContent = "";
      sendButton.disabled = true;
      sendButton.textContent = "Sending...";

      try {
        const { error } = await client.auth.resetPasswordForEmail(
          email,
          {
            redirectTo:
              "https://zyremarkertplace.github.io/CVPro-SA/reset-password.html"
          }
        );

        if (error) {
          throw error;
        }

        message.textContent =
          "If an account exists for this email, a password reset email will be sent. Check your inbox and spam folder. Open the newest email and follow its link.";

      } catch (error) {
        console.error("Password reset request failed:", error);

        message.textContent =
          "Unable to request the reset email. Please check your connection and try again. If the problem continues, check your Supabase Auth email settings.";

      } finally {
        sendButton.disabled = false;
        sendButton.textContent = "Send password reset link";
      }
    });
  </script>
</body>
</html>
