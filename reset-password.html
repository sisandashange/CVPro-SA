<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Reset Password | CVPro-SA</title>  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f5f5f5;
      color: #111;
      font-family: Arial, sans-serif;
    }

    .card {
      width: 100%;
      max-width: 420px;
      padding: 28px;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 14px;
    }

    h1 { margin-top: 0; font-size: 26px; }
    p { line-height: 1.5; color: #555; }

    label {
      display: block;
      margin: 18px 0 7px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #bbb;
      border-radius: 7px;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      border: 0;
      border-radius: 7px;
      background: #111;
      color: #fff;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled { opacity: .55; }

    .message {
      margin-top: 16px;
      overflow-wrap: anywhere;
      font-size: 14px;
    }

    .error { color: #b00020; }
    .success { color: #137333; }
    a { color: #111; }
    [hidden] { display: none !important; }
  </style></head><body>
  <main class="card">
    <h1>Reset your password</h1>
    <p>Create a new password for your CVPro-SA account.</p><p id="status" role="status">Checking your password-reset link...</p>

<form id="resetForm" hidden>
  <label for="password">New password</label>
  <input
    id="password"
    type="password"
    minlength="8"
    autocomplete="new-password"
    required
    placeholder="At least 8 characters"
  >

  <label for="confirmPassword">Confirm new password</label>
  <input
    id="confirmPassword"
    type="password"
    minlength="8"
    autocomplete="new-password"
    required
    placeholder="Enter the password again"
  >

  <button id="submitButton" type="submit">Save New Password</button>
</form>

<p id="message" class="message" aria-live="polite"></p>
<p><a href="./account.html">Go to Sign In</a></p>

  </main>  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>  <script>
    const SUPABASE_URL = "https://tnxlhpenttcynlmlohao.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_n4XzrnraET_AEMbCYtHV7Q_DJ8--zCL";

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY,
      {
        auth: {
          flowType: "implicit",
          detectSessionInUrl: true,
          persistSession: true,
          autoRefreshToken: true
        }
      }
    );

    const statusElement = document.getElementById("status");
    const form = document.getElementById("resetForm");
    const messageElement = document.getElementById("message");
    const submitButton = document.getElementById("submitButton");

    let recoveryReady = false;
    let processing = false;

    function showMessage(message, type) {
      messageElement.textContent = message;
      messageElement.className = "message " + (type || "");
    }

    function showError(message) {
      statusElement.textContent = message;
      form.hidden = true;
    }

    function enableRecovery() {
      recoveryReady = true;
      statusElement.textContent = "Recovery link verified. Choose a new password.";
      form.hidden = false;
    }

    async function initialise() {
      try {
        const url = new URL(window.location.href);
        const hashParams = new URLSearchParams(url.hash.slice(1));
        const queryParams = url.searchParams;

        const recoveryType =
          hashParams.get("type") || queryParams.get("type");

        // The recovery URL may contain access and refresh tokens in its fragment.
        const accessToken = hashParams.get("access_token");
        const refreshToken = hashParams.get("refresh_token");

        if (recoveryType === "recovery" && accessToken && refreshToken) {
          const { data, error } = await supabaseClient.auth.setSession({
            access_token: accessToken,
            refresh_token: refreshToken
          });

          if (error) throw error;

          if (data.session) {
            enableRecovery();
            return;
          }
        }

        // Support links that use the PKCE authorization-code flow.
        const code = queryParams.get("code");

        if (code) {
          const { data, error } =
            await supabaseClient.auth.exchangeCodeForSession(code);

          if (error) throw error;

          if (data.session) {
            enableRecovery();
            return;
          }
        }

        // Also support a recovery event emitted by Supabase Auth.
        const { data: sessionData, error: sessionError } =
          await supabaseClient.auth.getSession();

        if (sessionError) throw sessionError;

        if (sessionData.session && recoveryType === "recovery") {
          enableRecovery();
          return;
        }

        showError(
          "We couldn't verify this password-reset link. Please request a new reset email and open its latest link."
        );
      } catch (error) {
        console.error("Password recovery initialisation failed:", error);
        showError(
          "We couldn't verify this password-reset link. Please request a new reset email and open its latest link."
        );
      }
    }

    supabaseClient.auth.onAuthStateChange((event) => {
      if (event === "PASSWORD_RECOVERY") {
        enableRecovery();
      }
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      if (!recoveryReady || processing) return;

      const password = document.getElementById("password").value;
      const confirmPassword =
        document.getElementById("confirmPassword").value;

      if (password.length < 8) {
        showMessage("Your password must contain at least 8 characters.", "error");
        return;
      }

      if (password !== confirmPassword) {
        showMessage("The passwords do not match.", "error");
        return;
      }

      processing = true;
      submitButton.disabled = true;
      submitButton.textContent = "Saving...";

      try {
        const { error } = await supabaseClient.auth.updateUser({
          password: password
        });

        if (error) throw error;

        showMessage(
          "Your password has been updated. You can now sign in with your new password.",
          "success"
        );

        form.hidden = true;
        statusElement.textContent = "Password updated successfully.";

        await supabaseClient.auth.signOut();

        // Remove recovery tokens from the browser address bar.
        window.history.replaceState(
          {},
          document.title,
          window.location.pathname
        );
      } catch (error) {
        console.error("Password update failed:", error);
        showMessage(
          error.message || "We couldn't update your password. Please try again.",
          "error"
        );
      } finally {
        processing = false;
        submitButton.disabled = false;
        submitButton.textContent = "Save New Password";
      }
    });

    initialise();
  </script></body>
</html>
