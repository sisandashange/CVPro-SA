<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Reset Password | CVPro-SA</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f5f5f5;
      color: #111;
      font-family: Arial, sans-serif;
    }

    .card {
      width: 100%;
      max-width: 420px;
      padding: 28px 22px;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 14px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
    }

    h1 {
      margin: 0 0 10px;
      font-size: 27px;
    }

    .subtitle {
      margin: 0 0 24px;
      color: #555;
      line-height: 1.5;
    }

    label {
      display: block;
      margin: 16px 0 7px;
      font-weight: bold;
      font-size: 14px;
    }

    input {
      width: 100%;
      min-height: 46px;
      padding: 12px;
      border: 1px solid #bbb;
      border-radius: 8px;
      font-size: 16px;
    }

    button,
    .link-button {
      display: block;
      width: 100%;
      min-height: 46px;
      margin-top: 20px;
      padding: 13px;
      border: 0;
      border-radius: 8px;
      background: #111;
      color: #fff;
      font-size: 16px;
      font-weight: bold;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    #message {
      display: none;
      margin-top: 18px;
      padding: 12px;
      border-radius: 8px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    #message.success {
      display: block;
      background: #e8f7ed;
      color: #14532d;
    }

    #message.error {
      display: block;
      background: #fff0f0;
      color: #991b1b;
    }

    .small {
      margin-top: 18px;
      color: #666;
      font-size: 13px;
      line-height: 1.5;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>

<body>
  <main class="card">
    <h1>Reset your password</h1>
    <p class="subtitle">
      Create a new password for your CVPro-SA account.
    </p>

    <div id="loading">
      Checking your password-reset link...
    </div>

    <form id="resetForm" class="hidden">
      <label for="password">New password</label>
      <input
        id="password"
        type="password"
        autocomplete="new-password"
        minlength="8"
        required
        placeholder="At least 8 characters"
      >

      <label for="confirmPassword">Confirm new password</label>
      <input
        id="confirmPassword"
        type="password"
        autocomplete="new-password"
        minlength="8"
        required
        placeholder="Enter the password again"
      >

      <button id="saveButton" type="submit">
        Save New Password
      </button>
    </form>

    <div id="message" role="status" aria-live="polite"></div>

    <a
      id="loginLink"
      class="link-button hidden"
      href="./account.html"
    >
      Go to Sign In
    </a>

    <p class="small">
      For your security, password-reset links expire and may only be used once.
      If your link has expired, request a new one from the sign-in page.
    </p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL = "https://tnxlhpenttcynlmlohao.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_n4XzrnraET_AEMbCYtHV7Q_DJ8--zCL";

    const supabase = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    const loading = document.getElementById("loading");
    const resetForm = document.getElementById("resetForm");
    const passwordInput = document.getElementById("password");
    const confirmPasswordInput = document.getElementById("confirmPassword");
    const saveButton = document.getElementById("saveButton");
    const message = document.getElementById("message");
    const loginLink = document.getElementById("loginLink");

    let recoverySessionReady = false;
    let recoveryEventSeen = false;
    let checking = false;

    function showMessage(text, type) {
      message.textContent = text;
      message.className = type;
    }

    function showResetForm() {
      loading.classList.add("hidden");
      resetForm.classList.remove("hidden");
      message.className = "";
      message.textContent = "";
      recoverySessionReady = true;
    }

    function showFailure(text) {
      loading.classList.add("hidden");
      resetForm.classList.add("hidden");
      showMessage(text, "error");
      loginLink.classList.remove("hidden");
    }

    async function checkRecoveryLink() {
      if (checking || recoverySessionReady) return;
      checking = true;

      try {
        const hash = window.location.hash;
        const query = new URLSearchParams(window.location.search);

        const hashParams = new URLSearchParams(
          hash.startsWith("#") ? hash.slice(1) : hash
        );

        const errorCode =
          query.get("error_code") || hashParams.get("error_code");

        const errorDescription =
          query.get("error_description") ||
          hashParams.get("error_description");

        if (errorCode || errorDescription) {
          throw new Error(
            errorDescription
              ? errorDescription.replace(/\+/g, " ")
              : "This password-reset link is invalid or has expired."
          );
        }

        // Supabase may provide a recovery code in the URL.
        const code = query.get("code");

        if (code) {
          const { data, error } =
            await supabase.auth.exchangeCodeForSession(code);

          if (error) throw error;

          if (data.session) {
            showResetForm();
            return;
          }
        }

        // Some Supabase email templates provide access and refresh tokens
        // in the URL fragment instead.
        const accessToken = hashParams.get("access_token");
        const refreshToken = hashParams.get("refresh_token");
        const tokenType = hashParams.get("type");

        if (
          accessToken &&
          refreshToken &&
          (!tokenType || tokenType === "recovery")
        ) {
          const { data, error } =
            await supabase.auth.setSession({
              access_token: accessToken,
              refresh_token: refreshToken
            });

          if (error) throw error;

          if (data.session) {
            showResetForm();
            return;
          }
        }

        // A recovery event can arrive after the page loads.
        const { data: sessionData, error: sessionError } =
          await supabase.auth.getSession();

        if (sessionError) throw sessionError;

        if (sessionData.session && recoveryEventSeen) {
          showResetForm();
          return;
        }

        throw new Error(
          "The recovery link could not be verified. Please request a new password-reset email and open its link again."
        );
      } catch (error) {
        console.error("Password recovery check failed:", error);
        showFailure(
          error.message ||
          "This password-reset link is invalid or has expired. Please request a new one."
        );
      } finally {
        checking = false;
      }
    }

    supabase.auth.onAuthStateChange((event, session) => {
      if (event === "PASSWORD_RECOVERY") {
        recoveryEventSeen = true;
        showResetForm();
      }
    });

    resetForm.addEventListener("submit", async (event) => {
      event.preventDefault();

      if (!recoverySessionReady) {
        showMessage(
          "Your recovery link has not been verified. Please request a new link if this continues.",
          "error"
        );
        return;
      }

      const password = passwordInput.value;
      const confirmPassword = confirmPasswordInput.value;

      if (password.length < 8) {
        showMessage(
          "Your password must contain at least 8 characters.",
          "error"
        );
        return;
      }

      if (password !== confirmPassword) {
        showMessage("The passwords do not match.", "error");
        return;
      }

      saveButton.disabled = true;
      saveButton.textContent = "Saving...";

      try {
        const { error } = await supabase.auth.updateUser({
          password: password
        });

        if (error) throw error;

        resetForm.classList.add("hidden");
        showMessage(
          "Your password has been changed successfully. You can now sign in using your new password.",
          "success"
        );
        loginLink.classList.remove("hidden");

        // Remove recovery tokens from the address bar.
        window.history.replaceState(
          {},
          document.title,
          window.location.pathname
        );
      } catch (error) {
        console.error("Password update failed:", error);
        showMessage(
          error.message ||
          "We could not update your password. Please request a new reset link and try again.",
          "error"
        );
      } finally {
        saveButton.disabled = false;
        saveButton.textContent = "Save New Password";
      }
    });

    checkRecoveryLink();
  </script>
</body>
</html>
