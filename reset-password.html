<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#111111">
  <title>Reset Password | CVPro-SA</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f5f5f5;
      color: #111;
      font-family: Arial, sans-serif;
    }

    .card {
      width: 100%;
      max-width: 420px;
      padding: 28px 22px;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 14px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
    }

    h1 {
      margin: 0 0 10px;
      font-size: 27px;
    }

    .subtitle {
      margin: 0 0 24px;
      color: #555;
      line-height: 1.5;
    }

    label {
      display: block;
      margin: 16px 0 7px;
      font-weight: bold;
      font-size: 14px;
    }

    input {
      width: 100%;
      min-height: 46px;
      padding: 12px;
      border: 1px solid #bbb;
      border-radius: 8px;
      font-size: 16px;
    }

    button, .link-button {
      display: block;
      width: 100%;
      min-height: 46px;
      margin-top: 20px;
      padding: 13px;
      border: 0;
      border-radius: 8px;
      background: #111;
      color: #fff;
      font-size: 16px;
      font-weight: bold;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    #message {
      display: none;
      margin-top: 18px;
      padding: 12px;
      border-radius: 8px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    #message.success {
      display: block;
      background: #e8f7ed;
      color: #14532d;
    }

    #message.error {
      display: block;
      background: #fff0f0;
      color: #991b1b;
    }

    .small {
      margin-top: 18px;
      color: #666;
      font-size: 13px;
      line-height: 1.5;
    }

    .hidden { display: none !important; }
  </style>
</head>

<body>
  <main class="card">
    <h1>Reset your password</h1>
    <p class="subtitle">Create a new password for your CVPro-SA account.</p>

    <div id="loading">Checking your password-reset link...</div>

    <form id="resetForm" class="hidden">
      <label for="password">New password</label>
      <input
        id="password"
        type="password"
        autocomplete="new-password"
        minlength="8"
        required
        placeholder="At least 8 characters"
      >

      <label for="confirmPassword">Confirm new password</label>
      <input
        id="confirmPassword"
        type="password"
        autocomplete="new-password"
        minlength="8"
        required
        placeholder="Enter the password again"
      >

      <button id="saveButton" type="submit">Save New Password</button>
    </form>

    <div id="message" role="status" aria-live="polite"></div>

    <a id="loginLink" class="link-button hidden" href="./account.html">
      Go to Sign In
    </a>

    <p class="small">
      For your security, password-reset links expire and can only be used once.
      If your link expires, request a new one from the sign-in page.
    </p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL =
      "https://tnxlhpenttcynlmlohao.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_n4XzrnraET_AEMbCYtHV7Q_DJ8--zCL";

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY,
      {
        auth: {
          persistSession: true,
          autoRefreshToken: true,
          detectSessionInUrl: true,
          flowType: "pkce"
        }
      }
    );

    const loading = document.getElementById("loading");
    const resetForm = document.getElementById("resetForm");
    const passwordInput = document.getElementById("password");
    const confirmPasswordInput = document.getElementById("confirmPassword");
    const saveButton = document.getElementById("saveButton");
    const message = document.getElementById("message");
    const loginLink = document.getElementById("loginLink");

    let recoveryReady = false;
    let recoveryEventSeen = false;
    let finished = false;

    function showMessage(text, type) {
      message.textContent = text;
      message.className = type;
    }

    function showResetForm() {
      if (finished) return;

      recoveryReady = true;
      loading.classList.add("hidden");
      resetForm.classList.remove("hidden");
      message.className = "";
      message.textContent = "";
    }

    function showFailure(text) {
      if (finished) return;

      finished = true;
      loading.classList.add("hidden");
      resetForm.classList.add("hidden");
      showMessage(text, "error");
      loginLink.classList.remove("hidden");
    }

    supabaseClient.auth.onAuthStateChange((event, session) => {
      if (event === "PASSWORD_RECOVERY" && session) {
        recoveryEventSeen = true;
        showResetForm();
      }
    });

    async function initializeRecovery() {
      try {
        const query = new URLSearchParams(window.location.search);
        const hash = new URLSearchParams(
          window.location.hash.startsWith("#")
            ? window.location.hash.slice(1)
            : window.location.hash
        );

        const errorCode =
          query.get("error_code") || hash.get("error_code");
        const errorDescription =
          query.get("error_description") ||
          hash.get("error_description");

        if (errorCode || errorDescription) {
          throw new Error(
            errorDescription
              ? errorDescription.replace(/\+/g, " ")
              : "This recovery link is invalid or expired."
          );
        }

        // Wait briefly for Supabase to process a recovery event.
        for (let attempt = 0; attempt < 20; attempt++) {
          if (recoveryEventSeen) return;

          const { data, error } =
            await supabaseClient.auth.getSession();

          if (error) throw error;

          if (data.session) {
            // A session alone is not enough to prove this is a recovery
            // session, so require a recovery event or valid recovery URL.
            const accessToken = hash.get("access_token");
            const tokenType = hash.get("type");
            const hasRecoveryFragment =
              Boolean(accessToken) && tokenType === "recovery";

            if (hasRecoveryFragment) {
              showResetForm();
              return;
            }

            if (recoveryEventSeen) {
              showResetForm();
              return;
            }
          }

          await new Promise(resolve => setTimeout(resolve, 250));
        }

        // PKCE links exchange the URL code for a session. If Supabase
        // hasn't processed it automatically, try exchanging it explicitly.
        const code = query.get("code");

        if (code) {
          const { data, error } =
            await supabaseClient.auth.exchangeCodeForSession(code);

          if (error) throw error;

          if (data.session) {
            showResetForm();
            return;
          }
        }

        // Token-hash links may be delivered with type=recovery.
        const tokenHash =
          query.get("token_hash") || hash.get("token_hash");
        const recoveryType =
          query.get("type") || hash.get("type");

        if (tokenHash && recoveryType === "recovery") {
          const { data, error } =
            await supabaseClient.auth.verifyOtp({
              token_hash: tokenHash,
              type: "recovery"
            });

          if (error) throw error;

          if (data.session) {
            showResetForm();
            return;
          }
        }

        if (recoveryEventSeen) return;

        throw new Error(
          "We couldn't verify this password-reset link. Please request a new reset email and open its latest link."
        );
      } catch (error) {
        console.error("Recovery initialization failed:", error);

        showFailure(
          error.message ||
          "This password-reset link is invalid or has expired. Please request a new one."
        );
      }
    }

    resetForm.addEventListener("submit", async (event) => {
      event.preventDefault();

      if (!recoveryReady) {
        showMessage(
          "Your recovery link has not been verified. Please request a new reset email.",
          "error"
        );
        return;
      }

      const password = passwordInput.value;
      const confirmPassword = confirmPasswordInput.value;

      if (password.length < 8) {
        showMessage(
          "Your password must contain at least 8 characters.",
          "error"
        );
        return;
      }

      if (password !== confirmPassword) {
        showMessage("The passwords do not match.", "error");
        return;
      }

      saveButton.disabled = true;
      saveButton.textContent = "Saving...";

      try {
        const { error } = await supabaseClient.auth.updateUser({
          password
        });

        if (error) throw error;

        finished = true;
        recoveryReady = false;
        resetForm.classList.add("hidden");
        showMessage(
          "Your password has been changed successfully. You can now sign in with your new password.",
          "success"
        );
        loginLink.classList.remove("hidden");

        await supabaseClient.auth.signOut();

        // Remove recovery details from the address bar.
        window.history.replaceState(
          {},
          document.title,
          window.location.pathname
        );
      } catch (error) {
        console.error("Password update failed:", error);
        showMessage(
          error.message ||
          "We couldn't update your password. Please try again.",
          "error"
        );
      } finally {
        saveButton.disabled = false;
        saveButton.textContent = "Save New Password";
      }
    });

    initializeRecovery();
  </script>
</body>
</html>
