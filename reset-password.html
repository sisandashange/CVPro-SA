<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>CVPro-SA | Reset Password</title>  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: #f4f4f4;
      color: #111;
      font-family: Arial, sans-serif;
    }

    .card {
      width: 100%;
      max-width: 420px;
      padding: 25px;
      background: white;
      border: 1px solid #ddd;
      border-radius: 14px;
      box-shadow: 0 5px 20px rgba(0,0,0,.05);
    }

    h1 { margin-top: 0; font-size: 25px; }

    p {
      color: #555;
      line-height: 1.5;
      font-size: 14px;
    }

    label {
      display: block;
      margin: 16px 0 7px;
      font-size: 14px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #bbb;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 18px;
      background: #111;
      color: white;
      border: 0;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled { opacity: .6; }

    #message {
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      overflow-wrap: anywhere;
      font-size: 14px;
    }

    .error { background: #ffe8e8; color: #8c1111; }
    .success { background: #e5f7e9; color: #145c2e; }
    .info { background: #eee; color: #333; }

    a { color: #111; }
    .hidden { display: none; }
  </style></head><body>
  <main class="card">
    <h1>Set a new password</h1>
    <p>
      Use this page after opening the password-reset email sent by
      CVPro-SA. Choose a password you haven't used elsewhere.
    </p><form id="resetForm">
  <label for="password">New password</label>
  <input
    id="password"
    type="password"
    autocomplete="new-password"
    minlength="8"
    required
    placeholder="At least 8 characters"
  >

  <label for="confirmPassword">Confirm new password</label>
  <input
    id="confirmPassword"
    type="password"
    autocomplete="new-password"
    minlength="8"
    required
    placeholder="Enter the password again"
  >

  <button id="submitButton" type="submit">Update password</button>
</form>

<div id="message" class="hidden" role="status" aria-live="polite"></div>

<p>
  Once your password is updated, you can sign in to the
  <a href="./owner-payments.html">Owner Payments page</a>.
</p>

  </main>  <script>
    (() => {
      "use strict";

      const SUPABASE_URL = "https://tnxlhpenttcynlmlohao.supabase.co";
      const SUPABASE_PUBLISHABLE_KEY =
        "sb_publishable_n4XzrnraET_AEMbCYtHV7Q_DJ8--zCL";

      const client = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY,
        {
          auth: {
            persistSession: true,
            autoRefreshToken: true,
            detectSessionInUrl: true
          }
        }
      );

      const form = document.getElementById("resetForm");
      const passwordInput = document.getElementById("password");
      const confirmInput = document.getElementById("confirmPassword");
      const button = document.getElementById("submitButton");
      const message = document.getElementById("message");

      function showMessage(text, type) {
        message.textContent = text;
        message.className = type;
      }

      let recoveryReady = false;

      function updateRecoveryState() {
        // Supabase may deliver the recovery session via an auth event.
        // The form remains usable only after a valid session is available.
        client.auth.getSession().then(({ data, error }) => {
          if (!error && data.session) {
            recoveryReady = true;
            showMessage(
              "Recovery session verified. You can now choose a new password.",
              "info"
            );
          }
        });
      }

      client.auth.onAuthStateChange((event, session) => {
        if (
          (event === "PASSWORD_RECOVERY" || event === "SIGNED_IN") &&
          session
        ) {
          recoveryReady = true;
          showMessage(
            "Recovery link accepted. Choose your new password below.",
            "info"
          );
        }
      });

      updateRecoveryState();

      form.addEventListener("submit", async (event) => {
        event.preventDefault();

        const password = passwordInput.value;
        const confirmation = confirmInput.value;

        if (password.length < 8) {
          showMessage("Use at least 8 characters for your password.", "error");
          return;
        }

        if (password !== confirmation) {
          showMessage("The passwords do not match.", "error");
          return;
        }

        button.disabled = true;
        button.textContent = "Updating…";

        try {
          const { data, error: sessionError } = await client.auth.getSession();

          if (sessionError || !data.session) {
            throw new Error(
              "No valid recovery session was found. Request a new recovery email and open its link again."
            );
          }

          const { error } = await client.auth.updateUser({ password });

          if (error) throw error;

          showMessage(
            "Your password has been updated. You can now open the Owner Payments page and sign in with your new password.",
            "success"
          );

          passwordInput.value = "";
          confirmInput.value = "";
        } catch (error) {
          showMessage(
            error.message || "Password update failed. Request a new recovery link and try again.",
            "error"
          );
        } finally {
          button.disabled = false;
          button.textContent = "Update password";
        }
      });
    })();
  </script></body>
</html>
